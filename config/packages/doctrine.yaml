doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        dql:
            string_functions:
                JSONB_GET_TEXT: DealVault\Shared\Doctrine\Query\JsonbGetText
                CAST_NUMERIC: DealVault\Shared\Doctrine\Query\CastNumeric
        mappings:
            DealVault:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Entity'
                prefix: 'DealVault\Identity\Entity'
            Shared:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Shared/Entity'
                prefix: 'DealVault\Shared\Entity'
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Entity'
                prefix: 'DealVault\Identity\Entity'
            Ingestion:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Ingestion/Entity'
                prefix: 'DealVault\Ingestion\Entity'
            ReviewQueue:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/ReviewQueue/Entity'
                prefix: 'DealVault\ReviewQueue\Entity'
            Portfolio:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Portfolio/Entity'
                prefix: 'DealVault\Portfolio\Entity'
            Dealflow:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Dealflow/Entity'
                prefix: 'DealVault\Dealflow\Entity'
        filters:
            tenant_filter:
                class: DealVault\Shared\MultiTenancy\Doctrine\TenantFilter
                enabled: true

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
