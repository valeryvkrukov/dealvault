framework:
    messenger:
        failure_transport: failed

        transports:
            async_ingestion:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 2000
            failed:
                dsn: 'doctrine://default?queue_name=failed'

        routing:
            DealVault\Ingestion\Message\ProcessDocumentCommand: async_ingestion
