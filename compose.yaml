
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html:rw
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:rw
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealvault
      POSTGRES_USER: dealvault_user
      POSTGRES_PASSWORD: dealvault_pass
    ports:
      - "5412:5412"
    volumes:
      - postgres_data:/var/lib/postgresql/data:rw

  postgres_test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dealvault_test
      POSTGRES_USER: dealvault_user
      POSTGRES_PASSWORD: dealvault_pass

  redis:
    image: redis:latest
    volumes:
      - redis_data:/data

  mailer:
    image: axllent/mailpit
    ports:
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
